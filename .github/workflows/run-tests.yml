name: run-tests

on:
  push:
    branches: [main, '0.*.x', '1.*.x']
  pull_request:
    branches: [main, '0.*.x', '1.*.x']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4, 8.5, 8.6]
        laravel: [12.*, 13.*]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          # Laravel 13 (and Testbench 11) need PHP 8.3.
          - laravel: 13.*
            php: 8.2
          # Laravel 12 is not PHP 8.6-ready (deprecated spl_object_hash(),
          # and ArraySessionHandler missing create_sid() becomes an ErrorException).
          - laravel: 12.*
            php: 8.6

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system font dependencies
        run: |
          # ubuntu-latest is 26.04. Its preinstalled Microsoft apt repo returns 403,
          # and apt-get update then exits 100 before fonts-dejavu-core can be installed.
          sudo grep -l 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install dependencies
        run: |
          # composer.json pins platform php 8.2 for local installs; CI resolves for the real PHP.
          composer config --unset platform.php
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          # 8.5/8.6 may not yet appear in every dependency's platform constraint.
          if [ "${{ matrix.php }}" = "8.5" ] || [ "${{ matrix.php }}" = "8.6" ]; then
            composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --ignore-platform-req=php+
          else
            composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction
          fi

      - name: Show resolved Filament version
        # prefer-lowest runs the minimum (^5.8.3), prefer-stable the newest 5.x (5.12+ changed hook storage).
        run: composer show filament/schemas | grep -E '^versions'

      - name: Execute tests
        run: vendor/bin/pest --parallel

  gd-only:
    # Imagick is optional: PNG rendering, logos and captions fall back to GD.
    # This job proves the package works (and the GD goldens match) without it.
    runs-on: ubuntu-latest
    name: P8.4 - L13.* - prefer-stable - GD only (no Imagick)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system font dependencies
        run: |
          sudo grep -l 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, :imagick
          coverage: none

      - name: Assert Imagick is not loaded
        run: |
          php -r 'if (extension_loaded("imagick")) { fwrite(STDERR, "imagick is loaded\n"); exit(1); } echo "GD only: ", gd_info()["GD Version"], PHP_EOL;'

      - name: Install dependencies
        run: |
          composer config --unset platform.php
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --parallel

  coverage:
    runs-on: ubuntu-latest
    name: P8.4 - L13.* - prefer-stable - Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system font dependencies
        run: |
          sudo grep -l 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: pcov

      - name: Install dependencies
        run: |
          composer config --unset platform.php
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests with coverage
        run: |
          mkdir -p build
          vendor/bin/pest --parallel --coverage --coverage-clover=build/clover.xml --coverage-text=build/coverage.txt
          {
            echo "## PHP 8.4 / Laravel 13 Coverage (pcov)"
            echo ""
            php -r '
              $xml = @simplexml_load_file("build/clover.xml");
              if ($xml && isset($xml->project->metrics)) {
                $m = $xml->project->metrics;
                $stmts = (int) $m["statements"];
                $cov = (int) $m["coveredstatements"];
                $methods = (int) $m["methods"];
                $covMethods = (int) $m["coveredmethods"];
                $elements = (int) $m["elements"];
                $covElements = (int) $m["coveredelements"];
                $pct = $stmts > 0 ? round(($cov / $stmts) * 100, 2) : 0;
                $mpct = $methods > 0 ? round(($covMethods / $methods) * 100, 2) : 0;
                $epct = $elements > 0 ? round(($covElements / $elements) * 100, 2) : 0;
                echo "- **Statements:** {$cov} / {$stmts} ({$pct}%)
";
                echo "- **Methods:** {$covMethods} / {$methods} ({$mpct}%)
";
                echo "- **Elements:** {$covElements} / {$elements} ({$epct}%)

";
              }
            '
            echo "<details><summary>Coverage report by file</summary>"
            echo ""
            echo '```text'
            cat build/coverage.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
