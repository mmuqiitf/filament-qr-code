name: run-tests

on:
  push:
    branches: [main, '0.*.x', '1.*.x']
  pull_request:
    branches: [main, '0.*.x', '1.*.x']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          # Laravel 13 (and Testbench 11) need PHP 8.3.
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system font dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install dependencies
        run: |
          # composer.json pins platform php 8.2 for local installs; CI resolves for the real PHP.
          composer config --unset platform.php
          # Every Laravel 11 release now carries Packagist security advisories (L11 is EOL),
          # so Composer refuses to resolve it. Ignore only those (CI only) to keep testing L11.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then composer config policy.advisories.ignore --json '["laravel/framework"]'; fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          if [ "${{ matrix.php }}" = "8.5" ]; then
            composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --ignore-platform-req=php+
          else
            composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction
          fi

      - name: Execute tests
        run: vendor/bin/pest
